name: HPLauncher
options:
  bundleIdPrefix: app.hplauncher
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: MD83L42DNL
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64   # CrossOver Preview and the Remastered engines are Apple silicon only
targets:
  HPLauncher:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    settings:
      base:
        PRODUCT_NAME: "HP Launcher"
        PRODUCT_BUNDLE_IDENTIFIER: app.hplauncher.mac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        COMBINE_HIDPI_IMAGES: YES
  HPLauncherTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: HPLauncher
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HP Launcher.app/Contents/MacOS/HP Launcher"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  HPLauncher:
    build:
      targets:
        HPLauncher: all
    test:
      targets: [HPLauncherTests]
